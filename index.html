<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aswin's Money Manager</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#f3f4f6; font-family:sans-serif; }
.page { display:none; }
.active { display:block; }

/* UI STYLE */
.card { background:#fff; border-radius:10px; padding:12px; margin-top:10px; }

.btn { padding:4px 10px; font-size:12px; border-radius:4px; color:white; }
.edit { background:#3b82f6; }
.paid { background:#22c55e; }
.paid2 { background:#ec4899; }
.delete { background:#ef4444; }

.topbar { background:#2563eb; color:white; padding:10px; display:flex; justify-content:space-between; }
.nav { display:flex; justify-content:space-around; background:#d1d5db; padding:8px; }
</style>
</head>

<body>

<div class="topbar">
<span>Aswin's Money Manager</span>
<span>🌙</span>
</div>

<div class="nav">
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('log')">Log</button>
<button onclick="showPage('clients')">Clients</button>
<button onclick="showPage('calendar')">Calendar</button>
<button onclick="showPage('summary'); renderSummary()">Summary</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page active p-3">

<div class="card">Monthly: <span id="monthCount">0</span></div>
<div class="card">Weekly: <span id="weekCount">0</span></div>
<div class="card">Received: $<span id="received">0</span></div>
<div class="card">Pending: $<span id="pending">0</span></div>

<div class="card">
<input id="name" placeholder="Name" class="border p-1 w-full mb-2">
<input type="date" id="date" class="border p-1 w-full mb-2">
<input type="time" id="time" class="border p-1 w-full mb-2">
<button onclick="addService()" class="btn edit w-full">Add</button>
</div>

</div>

<!-- LOG -->
<div id="log" class="page p-3">
<h3>Log History</h3>
<div id="logList"></div>
</div>

<!-- CLIENTS -->
<div id="clients" class="page p-3">
<h3>Clients</h3>
<div id="clientList"></div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="page p-3">
<input type="date" id="calDate" onchange="showCalendarLogs()" class="border p-2 w-full">
<div id="calLogs"></div>
</div>

<!-- SUMMARY -->
<div id="summary" class="page p-3">
<div class="card"><canvas id="dayChart"></canvas></div>
<div class="card"><canvas id="weekChart"></canvas></div>
</div>

<script>

let logs = JSON.parse(localStorage.getItem("logs")) || [];

function save(){
localStorage.setItem("logs", JSON.stringify(logs));
updateStats();
renderLogs();
renderClients();
}

function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function addService(){
let name=nameInput.value;
let date=dateInput.value;
let time=timeInput.value;

if(!name||!date||!time) return alert("Fill all");

logs.push({name,date,time,paid:false});
save();
}

function formatTime(t){
let [h,m]=t.split(":");
h=Number(h);
let ampm=h>=12?"PM":"AM";
h=h%12||12;
return `${h}:${m} ${ampm}`;
}

/* LOG */
function renderLogs(){
logList.innerHTML="";
logs.forEach((l,i)=>{
logList.innerHTML+=`
<div class="card">
${l.name} - ${l.date} ${formatTime(l.time)}

<div class="mt-2 flex gap-2">
<button onclick="editLog(${i})" class="btn edit">Edit</button>
<button onclick="deleteLog(${i})" class="btn delete">Delete</button>
</div>
</div>`;
});
}

function editLog(i){
let n=prompt("Edit Name",logs[i].name);
if(n) logs[i].name=n;
save();
}

function deleteLog(i){
logs.splice(i,1);
save();
}

/* CLIENTS (SORTED BY HIGHEST DUE) */
function renderClients(){
let map={};

logs.forEach(l=>{
if(!map[l.name]) map[l.name]=0;
if(!l.paid) map[l.name]+=15;
});

// SORT DESCENDING
let sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);

clientList.innerHTML="";
sorted.forEach(([name,amount])=>{
clientList.innerHTML+=`
<div onclick="openClient('${name}')" class="card flex justify-between">
<span>${name}</span>
<span style="color:red">$${amount}</span>
</div>`;
});
}

function openClient(name){
let data=logs.map((l,i)=>({...l,i})).filter(l=>l.name==name);

let html=`<button onclick="renderClients()">← Back</button><h3>${name}</h3>`;

data.forEach(l=>{
html+=`
<div class="card">
${l.date} ${formatTime(l.time)}

<div class="mt-2 flex gap-2">
<button onclick="editLog(${l.i})" class="btn edit">Edit</button>
${!l.paid 
? `<button onclick="markPaid(${l.i})" class="btn paid">Paid</button>` 
: `<button onclick="markUnpaid(${l.i})" class="btn paid2">Paid Already</button>`}
<button onclick="deleteLog(${l.i})" class="btn delete">Delete</button>
</div>
</div>`;
});

html+=`<button onclick="share('${name}')" class="btn edit w-full mt-2">Share via WhatsApp</button>`;

clientList.innerHTML=html;
}

function markPaid(i){ logs[i].paid=true; save(); }
function markUnpaid(i){ logs[i].paid=false; save(); }

/* WHATSAPP */
function share(name){
let data=logs.filter(l=>l.name==name&&!l.paid);
let total=data.length*15;

let msg=`Hi ${name}\nPending:\n`;
data.forEach(l=>msg+=l.date+"\n");
msg+=`Total $${total}`;

let e=encodeURIComponent(msg);

window.location.href=`whatsapp://send?text=${e}`;
setTimeout(()=>window.open(`https://wa.me/?text=${e}`),1500);
}

/* CALENDAR */
function showCalendarLogs(){
let d=calDate.value;
calLogs.innerHTML="";

logs.forEach((l,i)=>{
if(l.date===d){
calLogs.innerHTML+=`
<div class="card">
${l.name} ${formatTime(l.time)}

<div class="mt-2 flex gap-2">
<button onclick="editLog(${i})" class="btn edit">Edit</button>
<button onclick="markPaid(${i})" class="btn paid">Paid</button>
<button onclick="deleteLog(${i})" class="btn delete">Delete</button>
</div>
</div>`;
}
});
}

/* SUMMARY */
let dayChart,weekChart;

function renderSummary(){

let days=[0,0,0,0,0,0,0];
let weeks=[0,0,0,0,0];

logs.forEach(l=>{
let d=new Date(l.date);

let day=d.getDay();
day=day==0?6:day-1;
days[day]++;

let w=Math.ceil(d.getDate()/7);
weeks[w-1]++;
});

if(dayChart) dayChart.destroy();
if(weekChart) weekChart.destroy();

dayChart=new Chart(dayChart=document.getElementById("dayChart"),{
type:"bar",
data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],datasets:[{data:days}]}
});

weekChart=new Chart(document.getElementById("weekChart"),{
type:"bar",
data:{labels:["W1","W2","W3","W4","W5"],datasets:[{data:weeks}]}
});
}

function updateStats(){
let m=0,w=0,r=0,p=0;
let now=new Date();

logs.forEach(l=>{
let d=new Date(l.date);
if(d.getMonth()==now.getMonth()) m++;
if(d>=new Date(Date.now()-7*86400000)) w++;
if(l.paid) r+=15; else p+=15;
});

monthCount.innerText=m;
weekCount.innerText=w;
received.innerText=r;
pending.innerText=p;
}

updateStats();
renderLogs();
renderClients();

</script>

</body>
</html>
