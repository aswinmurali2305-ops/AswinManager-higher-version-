<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aswin's Money Manager</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background-color: #e5e7eb; }
.dark { background-color: #000 !important; color: white; }

.page { display: none; }
.active { display: block; }

/* ✅ COMMON UI (YOUR STYLE) */
.card {
  background: white;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

.btn {
  padding: 4px 8px;
  color: white;
  border-radius: 4px;
  font-size: 12px;
}

.btn-blue { background: #3b82f6; }
.btn-green { background: #22c55e; }
.btn-red { background: #ef4444; }
.btn-pink { background: #ec4899; }

</style>
</head>

<body>

<!-- HEADER -->
<div class="flex justify-between p-3 bg-blue-600 text-white">
<button onclick="location.reload()">🔄</button>
<h1 class="font-bold">Aswin's Money Manager</h1>
<button onclick="toggleDark()">🌙</button>
</div>

<!-- NAV -->
<div class="flex justify-around bg-gray-300 p-2 text-sm flex-wrap">
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('log')">Log</button>
<button onclick="showPage('clients')">Clients</button>
<button onclick="showPage('calendar')">Calendar</button>
<button onclick="showPage('summary'); renderSummary()">Summary</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page active p-3">

<div class="grid grid-cols-2 gap-2 mb-3">
<div class="card">Monthly: <span id="monthCount">0</span></div>
<div class="card">Weekly: <span id="weekCount">0</span></div>
<div class="card">Received: $<span id="received">0</span></div>
<div class="card">Pending: $<span id="pending">0</span></div>
</div>

<div class="card">
<input id="name" placeholder="Customer Name" class="border p-1 w-full mb-2">
<input type="date" id="date" class="border p-1 w-full mb-2">
<input type="time" id="time" class="border p-1 w-full mb-2">
<button onclick="addService()" class="btn btn-blue w-full">Add</button>
</div>

</div>

<!-- LOG -->
<div id="log" class="page p-3">
<h2 class="font-bold mb-2">Log History</h2>
<div id="logList"></div>
</div>

<!-- CLIENTS -->
<div id="clients" class="page p-3">
<h2 class="font-bold mb-2">Clients</h2>
<div id="clientList"></div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="page p-3">
<input type="date" id="calDate" onchange="showCalendarLogs()" class="border p-2 w-full mb-2">
<div id="calLogs"></div>
</div>

<!-- SUMMARY -->
<div id="summary" class="page p-3">

<input type="month" id="monthPicker" onchange="renderSummary()" class="border p-2 w-full mb-3">

<div class="card"><h3>Services by Day</h3><canvas id="dayChart"></canvas></div>
<div class="card"><h3>Services by Week</h3><canvas id="weekChart"></canvas></div>
<div class="card"><h3>Revenue</h3><canvas id="revenueChart"></canvas></div>
<div class="card"><h3>Top Customers</h3><canvas id="customerChart"></canvas></div>

<button onclick="downloadCharts()" class="btn btn-green w-full mt-2">Download Charts</button>

</div>

<script>

let logs = JSON.parse(localStorage.getItem("logs")) || [];

function save(){
localStorage.setItem("logs", JSON.stringify(logs));
updateStats();
renderLogs();
renderClients();
}

function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function toggleDark(){
document.body.classList.toggle("dark");
}

/* FORMAT */
function formatTime(t){
let [h,m]=t.split(":");
h=Number(h);
let ampm=h>=12?"PM":"AM";
h=h%12||12;
return `${h}:${m} ${ampm}`;
}

/* ADD */
function addService(){
let name=nameInput.value;
let date=dateInput.value;
let time=timeInput.value;

if(!name||!date||!time) return alert("Fill all");

logs.push({name,date,time,paid:false});
save();
}

/* STATS */
function updateStats(){
let now=new Date();
let m=0,w=0,r=0,p=0;

logs.forEach(l=>{
let d=new Date(l.date);
if(d.getMonth()==now.getMonth()) m++;
if(d>=new Date(Date.now()-7*86400000)) w++;
if(l.paid) r+=15; else p+=15;
});

monthCount.innerText=m;
weekCount.innerText=w;
received.innerText=r;
pending.innerText=p;
}

/* LOG */
function renderLogs(){
logList.innerHTML="";
logs.forEach((l,i)=>{
logList.innerHTML+=`
<div class="card">
${l.name} - ${l.date} ${formatTime(l.time)}
<div class="flex gap-2 mt-2">
<button onclick="deleteLog(${i})" class="btn btn-red">Delete</button>
</div>
</div>`;
});
}

function deleteLog(i){
logs.splice(i,1);
save();
}

/* CLIENTS */
function renderClients(){
let map={};

logs.forEach(l=>{
if(!map[l.name]) map[l.name]=0;
if(!l.paid) map[l.name]+=15;
});

clientList.innerHTML="";
Object.keys(map).forEach(name=>{
clientList.innerHTML+=`
<div onclick="openClient('${name}')" class="card flex justify-between">
<span>${name}</span>
<span>$${map[name]}</span>
</div>`;
});
}

function openClient(name){
let data=logs.map((l,i)=>({...l,i})).filter(l=>l.name==name);

let html=`<button onclick="renderClients()" class="btn btn-blue">Back</button><h3>${name}</h3>`;

data.forEach(l=>{
html+=`
<div class="card">
${l.date} ${formatTime(l.time)}
<div class="flex gap-2 mt-2">
<button onclick="markPaid(${l.i})" class="btn btn-green">Paid</button>
<button onclick="deleteLog(${l.i})" class="btn btn-red">Delete</button>
</div>
</div>`;
});

html+=`<button onclick="share('${name}')" class="btn btn-blue w-full mt-2">Share via WhatsApp</button>`;

clientList.innerHTML=html;
}

function markPaid(i){
logs[i].paid=true;
save();
}

/* WHATSAPP */
function share(name){
let data=logs.filter(l=>l.name==name&&!l.paid);
let total=data.length*15;

let msg=`Hi ${name}\nPending:\n`;
data.forEach(l=>msg+=l.date+"\n");
msg+=`Total $${total}`;

let e=encodeURIComponent(msg);

window.location.href=`whatsapp://send?text=${e}`;
setTimeout(()=>window.open(`https://wa.me/?text=${e}`),1500);
}

/* CALENDAR */
function showCalendarLogs(){
let d=calDate.value;
calLogs.innerHTML="";

logs.forEach((l,i)=>{
if(l.date===d){
calLogs.innerHTML+=`
<div class="card">
${l.name} ${formatTime(l.time)}
<div class="flex gap-2 mt-2">
<button onclick="markPaid(${i})" class="btn btn-green">Paid</button>
<button onclick="deleteLog(${i})" class="btn btn-red">Delete</button>
</div>
</div>`;
}
});
}

/* SUMMARY */
let dayChart,weekChart,revenueChart,customerChart;

function renderSummary(){

let now=new Date();
let m=monthPicker.value?new Date(monthPicker.value).getMonth():now.getMonth();

let days=[0,0,0,0,0,0,0],weeks=[0,0,0,0,0],rev=[0,0,0,0,0],cust={};

logs.forEach(l=>{
let d=new Date(l.date);
if(d.getMonth()!=m) return;

let day=d.getDay(); day=day==0?6:day-1;
days[day]++;

let w=Math.ceil(d.getDate()/7);
weeks[w-1]++;

if(l.paid) rev[w-1]+=15;

if(!cust[l.name]) cust[l.name]=0;
cust[l.name]++;
});

let top=Object.entries(cust).sort((a,b)=>b[1]-a[1]).slice(0,5);

[dayChart,weekChart,revenueChart,customerChart].forEach(c=>{if(c)c.destroy();});

dayChart=new Chart(dayChart=document.getElementById("dayChart"),{type:"bar",data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],datasets:[{data:days}]}});

weekChart=new Chart(document.getElementById("weekChart"),{type:"bar",data:{labels:["W1","W2","W3","W4","W5"],datasets:[{data:weeks}]}});

revenueChart=new Chart(document.getElementById("revenueChart"),{type:"bar",data:{labels:["W1","W2","W3","W4","W5"],datasets:[{data:rev}]}});

customerChart=new Chart(document.getElementById("customerChart"),{type:"bar",data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1])}]}});

}

function downloadCharts(){
[dayChart,weekChart,revenueChart,customerChart].forEach((c,i)=>{
if(!c)return;
let a=document.createElement("a");
a.href=c.toBase64Image();
a.download=`chart${i}.png`;
a.click();
});
}

updateStats();
renderLogs();
renderClients();

</script>

</body>
</html>
